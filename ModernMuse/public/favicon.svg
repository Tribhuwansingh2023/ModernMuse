<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#f5f5f5"/>
  
  <!-- ModernMuse Monogram: M -->
  <g fill="#1a1a1a">
    <!-- Left vertical bar -->
    <rect x="20" y="25" width="8" height="50" rx="2"/>
    
    <!-- Right vertical bar -->
    <rect x="72" y="25" width="8" height="50" rx="2"/>
    
    <!-- Left diagonal -->
    <path d="M 28 25 L 50 50 L 50 75" stroke="#1a1a1a" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right diagonal -->
    <path d="M 72 75 L 50 50 L 50 25" stroke="#1a1a1a" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Accent dot -->
  <circle cx="85" cy="85" r="5" fill="#ff6b6b"/>
</svg>